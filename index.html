<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Shahi Dashboard</title>
    <meta
      name="description"
      content="Shahi is a real-time shipment management dashboard to manage trips, transporters, and delivery statuses efficiently."
    />
    <meta name="author" content="Shahi" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Shahi | Shipment Management Dashboard" />
    <meta
      property="og:description"
      content="Manage shipments, monitor trip statuses, and control logistics operations from a powerful real-time dashboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shahi | Shipment Management Dashboard" />
    <meta
      name="twitter:description"
      content="A modern logistics management dashboard for real-time shipment tracking and operations."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts (better than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
